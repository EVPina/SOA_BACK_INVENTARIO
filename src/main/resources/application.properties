# Application name
spring.application.name=soainventario
# ============================================
# CONFIGURACIÓN OBLIGATORIA PARA TU BASE DE DATOS
# ============================================
# Conexión a Neon PostgreSQL (usando tu cadena de conexión)
spring.datasource.url=jdbc:postgresql://ep-icy-shadow-amhk7up6-pooler.c-5.us-east-1.aws.neon.tech/inventario_db?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_IRns5uLEkmJ6
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURACIÓN JPA - IMPORTANTE PARA TU ESQUEMA
# ============================================
# Usar 'validate' porque ya tienes las tablas creadas con tu script
spring.jpa.hibernate.ddl-auto=validate

# Mostrar SQL para verificar las consultas
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# CONFIGURACIÓN DE TIPO UUID (Importante)
# ============================================
# Para que Hibernate maneje correctamente los UUID de PostgreSQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.uuid.generator=org.hibernate.id.UUIDGenerator

# ============================================
# NAMING STRATEGY (Para respetar tus nombres de columnas)
# ============================================
# Mantiene los nombres exactos de tus tablas y columnas (snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================
# PUERTO DE LA APLICACIÓN
# ============================================
server.port=8087

# ============================================
# LOGGING PARA DEPURAR
# ============================================
# Nivel de logging de tu aplicación
logging.level.com.donbelisario=DEBUG

# Ver las consultas SQL completas con parámetros
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Ver las transacciones
logging.level.org.springframework.transaction=DEBUG

# ============================================
# TIMEZONE Y FECHAS
# ============================================
# Configurar zona horaria (Perú)
spring.jackson.time-zone=America/Lima

# Formato de fechas (coincide con tu timestamp without time zone)
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ============================================
# JACKSON CONFIGURACIÓN
# ============================================
# No incluir propiedades nulas en JSON
spring.jackson.default-property-inclusion=non_null

# Usar snake_case en JSON (coincide con tus columnas)
spring.jackson.property-naming-strategy=SNAKE_CASE

# ============================================
# CONFIGURACIÓN DE CONEXIÓN (HikariCP)
# ============================================
# Pool de conexiones optimizado para Neon
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=InventarioHikariPool

# ============================================
# TRANSACCIONES
# ============================================
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ============================================
# VALIDACIÓN DE DATOS
# ============================================
# Para manejar validaciones de tus constraints (CHECK constraints)
spring.mvc.throw-exception-if-no-handler-found=true

# ============================================
# SWAGGER/OPENAPI (Documentación)
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

# ============================================
# CORS (Si tienes frontend separado)
# ============================================
# Descomenta si usas Angular/React en puertos diferentes
# spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:3000
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
# spring.web.cors.allowed-headers=*
# spring.web.cors.allow-credentials=true

# ============================================
# PERFORMANCE
# ============================================
# Optimizaciones para consultas
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.jdbc.batch_size=20

management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always